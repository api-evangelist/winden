name: Winden
description: 'Winden (Winden Technologies, Inc.) is a US fintech offering an AI-powered
  business credit card built to maximize cash back on every purchase. Its Visa commercial
  card advertises 2% unlimited cash back, and its Scout AI automatically hunts for
  discounts and promo codes at checkout. Alongside the card, Winden bundles business
  banking-style services: virtual cards with custom spend limits and merchant locks,
  free domestic ACH and wire transfers, invoicing and payment management, an AI CFO
  for accounting and cash-flow projections, 24/7 concierge support, and integrations
  with common accounting and payroll software. Winden is a consumer/SMB financial
  product; as of this enrichment pass it publishes no public developer API, SDKs,
  or API documentation surface.'
